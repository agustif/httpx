---
name: smolci-qa

on:
  workflow_dispatch:

jobs:
  tests:
    name: "Python ${{ matrix.python-version }}"
    runs-on: [self-hosted, smolci]

    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: "actions/checkout@v4"
      - uses: "actions/setup-python@v5"
        with:
          python-version: "${{ matrix.python-version }}"
          allow-prereleases: true
      - name: "Install system SQLite (smolci golden gap: setup-python toolchain needs libsqlite3.so.0)"
        run: |
          apt-get update -qq
          apt-get install -y -qq libsqlite3-0
      - name: "Install dependencies"
        run: "scripts/install"
      - name: "Run linting checks"
        run: "scripts/check"
      - name: "Pin build backend (hatchling==1.31.0; 1.32+ emits Metadata-Version 2.5, rejected by pinned twine==6.1.0/packaging)"
        run: |
          echo "hatchling==1.31.0" > "$RUNNER_TEMP/hatchling-pin.txt"
          echo "PIP_CONSTRAINT=$RUNNER_TEMP/hatchling-pin.txt" >> "$GITHUB_ENV"
      - name: "Build package & docs"
        run: "scripts/build"
      - name: "Run tests"
        run: "scripts/test"
      - name: "Enforce coverage"
        run: "scripts/coverage"
